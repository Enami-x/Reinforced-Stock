version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: stock_agent_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stock_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock_secret}
      POSTGRES_DB: ${POSTGRES_DB:-stock_insights}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stock_agent} -d ${POSTGRES_DB:-stock_insights}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
    driver: local
